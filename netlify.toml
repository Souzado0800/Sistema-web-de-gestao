[build]
  publish = "public"
  functions = "netlify/functions"

# Redireciona todas as chamadas de API para a Netlify Function unificada
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Fallback de SPA: Redireciona qualquer rota de página para o index.html (HTTP 200)
# Evita erros 404 ao recarregar a página em rotas como /products, /movements, etc.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de segurança recomendados para ambiente corporativo de produção
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
